# Balanceo de carga y tolerancia a fallos del API de La Lucha (Sesion 32)
# Se monta como /etc/nginx/conf.d/default.conf (contexto http de Nginx).

upstream backend_cluster {
    # Chequeo pasivo: 2 fallos seguidos sacan al nodo por 10 s; luego Nginx lo vuelve a probar
    server api_node_1:8081 max_fails=2 fail_timeout=10s;
    server api_node_2:8082 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

# Nombre del nodo que respondio (si hubo reintento, $upstream_addr trae los dos y gana el ultimo)
map $upstream_addr $nodo_ha {
    ~:8081$  api_node_1;
    ~:8082$  api_node_2;
    default  sin-nodo;
}

log_format ha '$time_iso8601 "$request" $status nodo=$nodo_ha upstream=[$upstream_addr] '
              'upstream_status=[$upstream_status] t=$request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log ha;

    # Salud del propio balanceador (no pasa a los nodos)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un nodo sano responde en milisegundos: si no conecta en 1 s se da por caido
        proxy_connect_timeout 1s;
        proxy_read_timeout 30s;

        # Si un nodo falla, la misma peticion se reenvia al otro sin que el usuario lo note
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        add_header X-Served-By $upstream_addr always;
        add_header X-Nodo $nodo_ha always;
    }
}
