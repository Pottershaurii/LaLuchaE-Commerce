name: Deploy lalucha-api

# Despliega el backend en Azure al mergear a main cambios del backend,
# o a mano desde Actions > Deploy lalucha-api > Run workflow.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lalucha-backend/**'
      - '.github/workflows/deploy-lalucha-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        run: |
          docker build -t ghcr.io/pottershaurii/lalucha-api:latest ./lalucha-backend
          docker push ghcr.io/pottershaurii/lalucha-api:latest

      - name: Desplegar en Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: lalucha-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ghcr.io/pottershaurii/lalucha-api:latest
