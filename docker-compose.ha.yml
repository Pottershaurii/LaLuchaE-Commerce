# Alta disponibilidad del API de La Lucha (Sesion 32, ISO/IEC 20000-1 cl. 8.7)
#
# Elimina el punto unico de fallo de la capa API: dos replicas activas del backend
# (api_node_1 y api_node_2) detras de un balanceador Nginx con chequeos de salud.
# La BD de este archivo es solo para pruebas locales y de CI; en Azure el API usa
# PostgreSQL Flexible y el equivalente de este balanceo es escalar el App Service
# a 2 instancias con "Health check" en /api/health.
#
# Uso local:
#   1. Definir DB_PASSWORD, JWT_SECRET y MAIL_PASSWORD en .env (Zero Hardcoding, ver .env.example)
#   2. docker compose -f docker-compose.ha.yml up -d --build --wait
#   3. curl -i http://localhost:8088/api/health   (cabeceras X-Nodo y X-Served-By)
#   4. Simular caida: docker stop api_node_1   |   Restablecer: docker start api_node_1
name: lalucha-ha

x-api-entorno: &api-entorno
  SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lalucha?currentSchema=lalucha
  DB_USERNAME: postgres
  DB_PASSWORD: ${DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  MAIL_USERNAME: ${MAIL_USERNAME:-sin-correo@example.com}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  # 2 replicas x 10 conexiones = 20 de las 35 que admite PostgreSQL Flexible B1ms
  DB_POOL_MAX: "10"

x-api: &api
  build: ./lalucha-backend
  image: lalucha-api:ha
  restart: unless-stopped
  # Mismos limites que un App Service B1 por instancia
  cpus: 1
  mem_limit: 1792m
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:$${SERVER_PORT}/api/health | grep -q UP"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 90s
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    container_name: lalucha_db
    environment:
      POSTGRES_DB: lalucha
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "${BD_PUERTO:-5433}:5432"
    healthcheck:
      # -h 127.0.0.1: solo responde cuando termino la carga inicial (schema + seed)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d lalucha"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Cada replica escucha en su propio puerto para que el balanceador identifique
  # que nodo atendio cada peticion (cabecera X-Nodo).
  api_node_1:
    <<: *api
    container_name: api_node_1
    environment:
      <<: *api-entorno
      SERVER_PORT: "8081"

  api_node_2:
    <<: *api
    container_name: api_node_2
    environment:
      <<: *api-entorno
      SERVER_PORT: "8082"

  balanceador:
    image: nginx:1.27-alpine
    container_name: lalucha_balanceador
    restart: unless-stopped
    ports:
      - "${HA_PUERTO:-8088}:80"
    volumes:
      - ./continuidad/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api_node_1:
        condition: service_healthy
      api_node_2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 3
