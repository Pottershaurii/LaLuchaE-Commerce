spring.application.name=lalucha-backend
server.port=8080

# ==========================================
# BASE DE DATOS POSTGRESQL (Activada)
# ==========================================
# Se configuran con variables de entorno (ver .env.example en la raiz).
# La URL y el usuario tienen valores para desarrollo local; la contrasena no (Zero Hardcoding).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=lalucha}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# none: Hibernate no crea ni altera tablas; el schema lo manda database/schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=lalucha
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# GMAIL / ENVIO DE CORREOS
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Credenciales de Gmail solo por variables de entorno, nunca escritas aqui (Zero Hardcoding)
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==========================================
# JWT
# ==========================================
# Zero Hardcoding: la clave JWT no tiene valor por defecto. Si falta JWT_SECRET
# (minimo 32 caracteres) la aplicacion no arranca, en lugar de firmar con una clave publica.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
