spring.application.name=lalucha-backend
server.port=8080

# ==========================================
# BASE DE DATOS POSTGRESQL (Activada)
# ==========================================
# Se configuran con variables de entorno (ver .env.example en la raiz).
# Los valores despues de ":" son solo para desarrollo local.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=lalucha}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------
# Pool de conexiones HikariCP (Plan de Capacidad, RFC-05)
# ------------------------------------------
# PostgreSQL Flexible B1ms admite 35 conexiones de usuario. Con 10 por instancia,
# 2 instancias del API usan 20 y quedan 15 libres para administracion y migraciones.
# Formula de referencia de HikariCP: (nucleos del servidor BD x 2) + 1 = 3 activas;
# el margen hasta 10 absorbe picos y esperas de red hacia Azure.
spring.datasource.hikari.pool-name=LaLuchaPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
# Si no hay conexion libre en 5 s, la peticion falla rapido en vez de quedarse colgada
spring.datasource.hikari.connection-timeout=5000
# Cierra conexiones ociosas a los 5 min y renueva todas cada 30 min
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
# Mantiene vivas las conexiones ociosas (evita cortes del firewall de Azure)
spring.datasource.hikari.keepalive-time=120000
# Avisa en el log si una conexion no se devuelve en 20 s (posible fuga)
spring.datasource.hikari.leak-detection-threshold=20000

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# none: Hibernate no crea ni altera tablas; el schema lo manda database/schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=lalucha
# Imprimir cada SQL en consola penaliza el rendimiento: solo se activa con JPA_SHOW_SQL=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}
# La conexion a la BD se libera al terminar cada transaccion, no al final de la peticion HTTP
spring.jpa.open-in-view=false

# ==========================================
# GMAIL / ENVIO DE CORREOS
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Reemplaza directamente con tus credenciales reales de Gmail (o usa variables de entorno)
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==========================================
# JWT
# ==========================================
# En produccion define JWT_SECRET (minimo 32 caracteres).
jwt.secret=${JWT_SECRET:solo-desarrollo-cambiar-en-produccion-LaLucha-2026}
jwt.expiration-ms=86400000
