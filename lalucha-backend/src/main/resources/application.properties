spring.application.name=lalucha-backend
server.port=8080

# ==========================================
# BASE DE DATOS POSTGRESQL (Activada)
# ==========================================
# Se configuran con variables de entorno (ver .env.example en la raiz).
# Los valores despues de ":" son solo para desarrollo local.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=lalucha}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# none: Hibernate no crea ni altera tablas; el schema lo manda database/schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=lalucha
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# GMAIL / ENVIO DE CORREOS
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Reemplaza directamente con tus credenciales reales de Gmail (o usa variables de entorno)
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==========================================
# JWT
# ==========================================
# En produccion define JWT_SECRET (minimo 32 caracteres).
jwt.secret=${JWT_SECRET:solo-desarrollo-cambiar-en-produccion-LaLucha-2026}
jwt.expiration-ms=86400000
