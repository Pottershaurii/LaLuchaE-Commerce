spring.application.name=lalucha-backend
server.port=${PORT:8080}

# ==========================================
# BASE DE DATOS POSTGRESQL (Activada)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=lalucha
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# GMAIL / ENVIO DE CORREOS
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Reemplaza directamente con tus credenciales reales de Gmail (o usa variables de entorno)
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true