spring.application.name=lalucha-backend
server.port=8080

# ==========================================
# BASE DE DATOS POSTGRESQL (Activada)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=lalucha
spring.datasource.username=postgres
spring.datasource.password=karidew
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# GMAIL / ENVIO DE CORREOS
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Reemplaza directamente con tus credenciales reales de Gmail (o usa variables de entorno)
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true